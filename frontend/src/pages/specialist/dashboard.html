<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет специалиста — DonTusa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="../../pages/public/index.html" class="navbar-logo">Don<span>Tusa</span></a>
            <nav class="navbar-links">
                <button class="btn btn-outline" id="logout-btn">Выйти</button>
            </nav>
        </div>
    </header>

    <!-- Кабинет -->
    <div class="dashboard">

        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="sidebar-title">Специалист</div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active">Мой профиль</a>
                <a href="#" class="sidebar-link">Заявки</a>
            </nav>
        </aside>

        <!-- Контент -->
        <main class="dashboard-content">
            <h2 class="page-title">Добро пожаловать в личный кабинет!</h2>

            <div class="card" style="max-width: 560px;">
                <h3 class="card-title mb-4">Профиль специалиста</h3>

                <form id="profile-form" novalidate>
                    <div class="form-group">
                        <label for="city">Город</label>
                        <input type="text" class="form-control" id="city" name="city" placeholder="Например: Москва" required>
                    </div>

                    <div class="form-group">
                        <label for="experience">Опыт (лет)</label>
                        <input type="number" class="form-control" id="experience" name="experience" min="0" placeholder="Например: 3" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Цена за услугу (руб.)</label>
                        <input type="number" class="form-control" id="price" name="price" min="0" placeholder="Например: 5000" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Сохранить профиль</button>

                    <!-- Сообщение об ошибке / успехе -->
                    <div class="form-error" id="profile-message"></div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Простая проверка авторизации
        const token = localStorage.getItem('dontusa_token');
        if (!token) {
            window.location.href = '../auth/login.html';
        }

        // Кнопка "Выйти"
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('dontusa_token');
            window.location.href = '../auth/login.html';
        });

        // Отправка формы профиля (пока просто валидация на фронте)
        document.getElementById('profile-form').addEventListener('submit', (event) => {
            event.preventDefault();

            const message = document.getElementById('profile-message');
            const city = document.getElementById('city').value.trim();
            const experience = document.getElementById('experience').value;
            const price = document.getElementById('price').value;

            if (!city || experience === '' || price === '') {
                message.textContent = 'Пожалуйста, заполните все поля.';
                message.classList.add('visible');
                return;
            }

            // Здесь позже будет POST-запрос на бэкенд
            message.style.backgroundColor = '#e8f6ec';
            message.style.border = '1px solid #a5d8b3';
            message.style.borderLeftColor = '#2f9e44';
            message.style.color = '#1e6b30';
            message.textContent = 'Профиль успешно сохранён!';
            message.classList.add('visible');
        });
    </script>
</body>
</html>
