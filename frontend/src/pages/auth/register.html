<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — DonTusa</title>
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/components.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="/services/api.js"></script>
  <script defer src="/main.js"></script>
  <script>
  // Принудительно связываем переменные
  window.api = window.dontusaAPI;
  window.authAPI = window.dontusaAPI ? window.dontusaAPI.authAPI : null;
  </script>
  <script defer src="/pages/auth/register-script.js"></script>
</head>
<body>
  <div class="confetti-container" id="confettiContainer"></div>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">
        <div class="logo-icon">🌸</div>
        <span>DonTusa</span>
      </a>
      <div class="navbar-actions">
        <a href="/auth/login.html" class="btn btn-ghost btn-sm">Войти</a>
      </div>
    </div>
  </nav>

  <main class="flex flex-col items-center justify-center" style="min-height: 75vh; padding: 40px 20px;">
    <div class="card max-w-lg p-8 w-full fade-in-up">
      <div class="text-center mb-8">
        <div class="logo-icon" style="width: 60px; height: 60px; font-size: 2rem; margin: 0 auto 16px;"></div>
        <h1 style="font-size: 2rem; margin-bottom: 8px;">Регистрация в DonTusa</h1>
        <p style="color: var(--text-muted);">Создайте аккаунт и начните organisovatь свой праздник.</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="full_name">ФИО</label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Иван Иванов" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="hello@dontusa.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 900 000 00 00">
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Повторите пароль</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="role_name">Выберите роль</label>
          <select id="role_name" name="role_name" class="form-control" required>
            <option value="customer">Заказчик (организую праздник)</option>
            <option value="specialist">Специалист (фотограф, ведущий, декоратор и т.д.)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-floral w-full mb-4" id="registerBtn">Создать аккаунт</button>
        <p class="text-center" style="color: var(--text-muted); font-size: 0.9rem;">
          Уже есть аккаунт? <a href="/auth/login.html" style="color: var(--color-accent); font-weight: 700;">Войти</a>
        </p>
      </form>

      <div id="registerError" class="error-message hidden text-center mt-4"></div>
    </div>
  </main>

  <footer style="margin-top: 40px;">
    <div class="footer-content">
      <div class="footer-brand">DonTusa</div>
      <p style="font-size: 0.9rem; opacity: 0.8;">© 2026 DonTusa. Платформа для организации праздников.</p>
    </div>
  </footer>
</body>
</html>
