<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — DonTusa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="../public/index.html" class="navbar-logo">Don<span>Tusa</span></a>
            <nav class="navbar-links">
                <a href="login.html" class="btn btn-outline">Войти</a>
            </nav>
        </div>
    </header>

    <!-- Форма регистрации -->
    <section class="section">
        <div class="container" style="max-width: 520px;">
            <div class="card">
                <h2 class="page-title" style="text-align: center;">Регистрация</h2>

                <form id="register-form" novalidate>
                    <div class="form-group">
                        <label for="full_name">ФИО</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Иванова Анна Сергеевна" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.ru" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 (900) 000-00-00" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Минимум 6 символов" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Повтор пароля</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required>
                    </div>

                    <div class="form-group">
                        <label for="role_name">Роль</label>
                        <select class="form-control" id="role_name" name="role_name" required>
                            <option value="customer">Заказчик</option>
                            <option value="specialist">Специалист</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-accent btn-block">Зарегистрироваться</button>

                    <!-- Сообщение об ошибке -->
                    <div class="form-error" id="error-message"></div>
                </form>

                <p class="mt-4" style="text-align: center; color: #8a7f81;">
                    Уже есть аккаунт? <a href="login.html" style="color: #C0350F; font-weight: 600;">Войти</a>
                </p>
            </div>
        </div>
    </section>

    <script src="register-script.js"></script>
</body>
</html>
