<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — DonTusa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="../public/index.html" class="navbar-logo">Don<span>Tusa</span></a>
            <nav class="navbar-links">
                <a href="register.html" class="btn btn-accent">Регистрация</a>
            </nav>
        </div>
    </header>

    <!-- Форма входа -->
    <section class="section">
        <div class="container" style="max-width: 480px;">
            <div class="card">
                <h2 class="page-title" style="text-align: center;">Вход в аккаунт</h2>

                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="login">Логин или Email</label>
                        <input type="text" class="form-control" id="login" name="login" placeholder="Введите логин или email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Войти</button>

                    <!-- Сообщение об ошибке -->
                    <div class="form-error" id="error-message"></div>
                </form>

                <p class="mt-4" style="text-align: center; color: #8a7f81;">
                    Нет аккаунта? <a href="register.html" style="color: #C0350F; font-weight: 600;">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </section>

    <script src="login-script.js"></script>
</body>
</html>
