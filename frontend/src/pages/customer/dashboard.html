<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет заказчика — DonTusa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="../../pages/public/index.html" class="navbar-logo">Don<span>Tusa</span></a>
            <nav class="navbar-links">
                <button class="btn btn-outline" id="logout-btn">Выйти</button>
            </nav>
        </div>
    </header>

    <!-- Кабинет -->
    <div class="dashboard">

        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="sidebar-title">Заказчик</div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active">Мои заказы</a>
                <a href="#" class="sidebar-link">Профиль</a>
            </nav>
        </aside>

        <!-- Контент -->
        <main class="dashboard-content">
            <h2 class="page-title">Добро пожаловать в личный кабинет!</h2>

            <div class="mb-4">
                <a href="#" class="btn btn-accent">Создать мероприятие</a>
            </div>

            <h3 class="mb-3">Мои заказы</h3>
            <div class="card">
                <p class="card-text text-muted" id="orders-empty">
                    У вас пока нет заказов. Нажмите «Создать мероприятие», чтобы начать.
                </p>
                <ul id="orders-list"></ul>
            </div>
        </main>
    </div>

    <script>
        // Простая проверка авторизации
        const token = localStorage.getItem('dontusa_token');
        if (!token) {
            window.location.href = '../auth/login.html';
        }

        // Кнопка "Выйти"
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('dontusa_token');
            window.location.href = '../auth/login.html';
        });
    </script>
</body>
</html>
